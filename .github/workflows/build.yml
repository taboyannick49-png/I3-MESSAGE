name: Build Android APK Universal

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android Project & Advanced Auto-Patch
      run: |
        # 1. Configuration des propriétés Gradle et mémoire RAM
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx3g -XX:+HeapDumpOnOutOfMemoryError" >> gradle.properties

        # 2. Création des dossiers de base
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        # 3. Fichier strings.xml minimal
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Mon Application IA</string>
        </resources>
        EOF

        # 4. Copie des fichiers XML de layout
        find . -maxdepth 4 -name "*.xml" ! -path "./app/*" ! -name "build.gradle*" -exec cp {} app/src/main/res/layout/ \; 2>/dev/null || true

        # 5. Script Python de nettoyage, organisation et patch intelligent des sources Kotlin
        python3 - << 'PYEOF'
        import os
        import re

        src_dir = "."
        target_base = "app/src/main/java"
        os.makedirs(target_base, exist_ok=True)

        for root, dirs, files in os.walk(src_dir):
            if "app" in root.split(os.sep) or ".git" in root.split(os.sep):
                continue
            for file in files:
                if file.endswith((".kt", ".java")):
                    src_path = os.path.join(root, file)
                    with open(src_path, "r", encoding="utf-8", errors="ignore") as f:
                        content = f.read()
                    
                    # Remplacements de compatibilité Compose / Material 3
                    content = content.replace("quadraticTo(", "quadraticBezierTo(")
                    
                    pkg_match = re.search(r"^\s*package\s+([\w\.]+)", content, re.MULTILINE)
                    
                    # Injection de l'import ripple si nécessaire
                    if "ripple(" in content and "import androidx.compose.material3.ripple" not in content:
                        if pkg_match:
                            pos = pkg_match.end()
                            content = content[:pos] + "\nimport androidx.compose.material3.ripple" + content[pos:]
                    
                    # Extraction du package
                    if pkg_match:
                        pkg_name = pkg_match.group(1)
                        rel_dir = pkg_name.replace(".", "/")
                    else:
                        rel_dir = "com/example/ia_app"
                        
                    dest_dir = os.path.join(target_base, rel_dir)
                    os.makedirs(dest_dir, exist_ok=True)
                    
                    # Injection de BuildConfig si nécessaire
                    if "BuildConfig" in content and "import com.example.ia_app.BuildConfig" not in content:
                        if pkg_match:
                            pos = pkg_match.end()
                            content = content[:pos] + "\nimport com.example.ia_app.BuildConfig" + content[pos:]
                        else:
                            content = "import com.example.ia_app.BuildConfig\n" + content
                            
                    dest_path = os.path.join(dest_dir, file)
                    with open(dest_path, "w", encoding="utf-8") as f:
                        f.write(content)
        print("Sources successfully processed and patched.")
        PYEOF

        # 6. Manifeste Android universel
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:label="@string/app_name"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                <activity
                    android:name="com.example.ia_app.MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 7. Structuration des fichiers Gradle complets (Kotlin 1.9.24 & Compose BOM 2024.09.00)
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
        }
        rootProject.name = "ia_app"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
            id 'com.google.devtools.ksp' version '1.9.24-1.0.20' apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
            id 'com.google.devtools.ksp'
        }

        android {
            namespace 'com.example.ia_app'
            compileSdk 34

            defaultConfig {
                applicationId "com.example.ia_app"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
                buildConfigField "String", "GEMINI_API_KEY", "\"AIzaSyDummyKeyForBuild\""
            }

            buildFeatures {
                buildConfig true
                compose true
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = '17'
            }

            composeOptions {
                kotlinCompilerExtensionVersion '1.5.14'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
            implementation 'androidx.activity:activity-compose:1.8.2'
            
            implementation platform('androidx.compose:compose-bom:2024.09.00')
            implementation 'androidx.compose.ui:ui'
            implementation 'androidx.compose.ui:ui-graphics'
            implementation 'androidx.compose.ui:ui-tooling-preview'
            implementation 'androidx.compose.material3:material3'
            implementation 'androidx.compose.material:material-icons-extended'
            implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
            implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
            
            implementation 'com.squareup.retrofit2:retrofit:2.9.0'
            implementation 'com.squareup.retrofit2:converter-moshi:2.9.0'
            implementation 'com.squareup.moshi:moshi-kotlin:1.15.0'
            implementation 'com.squareup.okhttp3:okhttp:4.12.0'
            implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

            def room_version = "2.6.1"
            implementation "androidx.room:room-runtime:$room_version"
            implementation "androidx.room:room-ktx:$room_version"
            ksp "androidx.room:room-compiler:$room_version"
            
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
        }
        EOF

    - name: Setup Gradle 8.5
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew

    - name: Build Debug APK with Stacktrace
      run: ./gradlew :app:assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: 'app/build/outputs/apk/debug/*.apk'
