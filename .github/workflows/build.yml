name: Build Android APK Universal

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android Project & Gradle Wrapper
      run: |
        # 1. Configuration des propriétés Gradle et augmentation de la mémoire RAM
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx3g -XX:+HeapDumpOnOutOfMemoryError" >> gradle.properties

        # 2. Création de l'arborescence par défaut
        mkdir -p app/src/main/java/com/example/ia_app
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        # 3. Fichier strings.xml minimal
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Mon Application IA</string>
        </resources>
        EOF

        # 4. Copie automatique des sources existantes (Java / Kotlin / Layouts)
        find . -maxdepth 4 -name "*.java" ! -path "./app/*" -exec cp {} app/src/main/java/com/example/ia_app/ \; 2>/dev/null || true
        find . -maxdepth 4 -name "*.kt" ! -path "./app/*" -exec cp {} app/src/main/java/com/example/ia_app/ \; 2>/dev/null || true
        find . -maxdepth 4 -name "*.xml" ! -path "./app/*" ! -name "build.gradle*" -exec cp {} app/src/main/res/layout/ \; 2>/dev/null || true

        # 5. Manifeste Android universel avec un thème natif système compatible
        MANIFEST_PATH=$(find . -maxdepth 4 -name "AndroidManifest.xml" ! -path "./app/*" | head -n 1)
        if [ -n "$MANIFEST_PATH" ]; then
          cp "$MANIFEST_PATH" app/src/main/AndroidManifest.xml
        else
          cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:label="@string/app_name"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                <activity
                    android:name="com.example.ia_app.MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        fi

        # 6. Structuration des fichiers Gradle avec Moshi, Retrofit, Room et Compose
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
        }
        rootProject.name = "ia_app"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
            id 'com.google.devtools.ksp' version '1.9.22-1.0.16' apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
            id 'com.google.devtools.ksp'
        }

        android {
            namespace 'com.example.ia_app'
            compileSdk 34

            defaultConfig {
                applicationId "com.example.ia_app"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
                buildConfigField "String", "GEMINI_API_KEY", "\"AIzaSyDummyKeyForBuild\""
            }

            buildFeatures {
                buildConfig true
                compose true
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = '17'
            }

            composeOptions {
                kotlinCompilerExtensionVersion '1.5.8'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
            implementation 'androidx.activity:activity-compose:1.8.2'
            
            implementation platform('androidx.compose:compose-bom:2024.02.00')
            implementation 'androidx.compose.ui:ui'
            implementation 'androidx.compose.ui:ui-graphics'
            implementation 'androidx.compose.ui:ui-tooling-preview'
            implementation 'androidx.compose.material3:material3'
            implementation 'androidx.compose.material:material-icons-extended'
            implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
            implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
            
            // Retrofit, OkHttp et Moshi pour l'API Gemini
            implementation 'com.squareup.retrofit2:retrofit:2.9.0'
            implementation 'com.squareup.retrofit2:converter-moshi:2.9.0'
            implementation 'com.squareup.moshi:moshi-kotlin:1.15.0'
            implementation 'com.squareup.okhttp3:okhttp:4.12.0'
            implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

            // Room Database pour le stockage local
            def room_version = "2.6.1"
            implementation "androidx.room:room-runtime:$room_version"
            implementation "androidx.room:room-ktx:$room_version"
            ksp "androidx.room:room-compiler:$room_version"
            
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
        }
        EOF

    - name: Setup Gradle 8.5
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: 'app/build/outputs/apk/debug/*.apk'
